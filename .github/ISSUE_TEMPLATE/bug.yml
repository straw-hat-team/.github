name: 🐞 Bug Report
description: Tell us about something that's not working the way we (probably) intend.
labels: ["kind:bug", "state:triage"]
body:
  - type: checkboxes
    id: initial-checklist
    attributes:
      label: Initial Checklist
      options:
        - label: I read the [Contributing guide](https://github.com/straw-hat-team/.github/blob/main/CONTRIBUTING.md) and the [Support guide](https://github.com/straw-hat-team/.github/blob/main/SUPPORT.md)
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/straw-hat-team/.github/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: I searched existing Issues, Pull Requests, and Discussions, and could not find anything related
          required: true
  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: What is the package version used?
      placeholder: "3.0.0"
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Are you using the latest version?
      description: Please upgrade the package to the latest version and check if the issue is resolved.
      options:
        - label: Yes, I verified the issue is still present in the latest version.
          required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: |-
        How can we see what you're seeing? Specific is terrific.

        A link to a repository or a runnable snippet beats a description. Strip out everything that
        is not needed to trigger the problem.
      placeholder: |-
        1. foo
        2. bar
        3. baz
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: Logs? Screenshots? Yes, please. Paste logs and errors as text, not only as images.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Language runtime and operating system.
      placeholder: "Elixir 1.18.1 / OTP 27, macOS 15.1"
    validations:
      required: false
