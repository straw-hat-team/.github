name: 💡 Feature Request
description: Tell us about a problem our software could solve but doesn't.
labels: ["kind:feature", "state:triage"]
body:
  - type: checkboxes
    id: initial-checklist
    attributes:
      label: Initial Checklist
      options:
        - label: I read the [Contributing guide](https://github.com/straw-hat-team/.github/blob/main/CONTRIBUTING.md) and the [Support guide](https://github.com/straw-hat-team/.github/blob/main/SUPPORT.md)
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/straw-hat-team/.github/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: I searched existing Issues, Pull Requests, and Discussions, and could not find anything related
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem could we solve that we don't?
      placeholder: |-
        I want to make whirled peas, but you don't blend.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Solution Brainstorm
      description: We know you have bright ideas to share ... share away, friend.
      placeholder: |-
        Add a blender.
    validations:
      required: false
